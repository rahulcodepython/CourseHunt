services:
  # traefik:
  #   image: traefik:v2.10
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--entrypoints.web.address=:80"
  #   ports:
  #     - "80:80"
  #     - "8081:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - coursehunt-network

  postgres:
    image: postgres:latest
    container_name: coursehunt-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coursehunt
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./package/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - coursehunt-network

  redis:
    image: redis:7-alpine
    container_name: coursehunt-redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - coursehunt-network

  # --------------------------------------------------------
  # GUI OPTION 1: WhoDB (Postgres + Redis) - Sleek & Minimal
  # --------------------------------------------------------
  whodb:
    image: clidey/whodb:latest
    container_name: coursehunt-whodb
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - coursehunt-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - coursehunt-network

  backend:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: coursehunt-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/coursehunt?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - coursehunt-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  coursehunt-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata: