services:
    traefik:
        image: traefik:latest
        command:
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--ping=true"
        ports:
            - "80:80"
            - "8081:8080" # Traefik dashboard
        environment:
            - DOCKER_API_VERSION=1.41
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD", "traefik", "healthcheck", "--ping" ]
            interval: 10s
            timeout: 5s
            retries: 3

    web:
        build:
            context: ./apps/web
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        container_name: coursehunt-web
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-coursehunt}?sslmode=disable}
        depends_on:
            postgres:
                condition: service_healthy
            backend:
                condition: service_started
        networks:
            - coursehunt-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.web.rule=PathPrefix(`/`)"
            - "traefik.http.routers.web.entrypoints=web"
            - "traefik.http.services.web.loadbalancer.server.port=${PORT:-8080}"
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-8080}/ || exit 1" ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 15s

    postgres:
        image: ${POSTGRES_IMAGE:-postgres:latest}
        container_name: ${POSTGRES_CONTAINER_NAME:-coursehunt-postgres}
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-coursehunt}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql
            - ./apps/server/internals/migrations:/docker-entrypoint-initdb.d:ro
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coursehunt}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: ${REDIS_IMAGE:-redis:7-alpine}
        container_name: ${REDIS_CONTAINER_NAME:-coursehunt-redis}
        env_file:
            - .env
        ports:
            - "${REDIS_PORT:-6379}:6379"
        restart: unless-stopped
        volumes:
            - redisdata:/data
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    mailpit:
        image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
        container_name: ${MAILPIT_CONTAINER_NAME:-coursehunt-mailpit}
        restart: unless-stopped
        ports:
            - "${MAILPIT_SMTP_PORT:-1025}:1025"
            - "${MAILPIT_UI_PORT:-8025}:8025"
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/livez || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    whodb:
        image: ${WHODB_IMAGE:-clidey/whodb:latest}
        container_name: ${WHODB_CONTAINER_NAME:-coursehunt-whodb}
        env_file:
            - .env
        restart: unless-stopped
        ports:
            - "${WHODB_PORT:-8085}:8080"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    minio:
        image: ${MINIO_IMAGE:-minio/minio:latest}
        container_name: ${MINIO_CONTAINER_NAME:-coursehunt-minio}
        env_file:
            - .env
        command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        ports:
            - "${MINIO_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_PORT:-9001}:9001"
        volumes:
            - miniodata:/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.minio.rule=PathPrefix(`/coursehunt`)"
            - "traefik.http.routers.minio.entrypoints=web"
            - "traefik.http.services.minio.loadbalancer.server.port=9000"
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "mc ready local || curl -f http://localhost:${MINIO_PORT:-9000}/minio/health/live || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    backend:
        build:
            context: .
            dockerfile: ./apps/server/Dockerfile
        container_name: ${BACKEND_CONTAINER_NAME:-coursehunt-backend}
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - PORT=${PORT:-8080}
            - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-coursehunt}?sslmode=disable}
            - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
            - REDIS_PORT=${REDIS_PORT:-6379}
            - MINIO_ENDPOINT=${DOCKER_MINIO_ENDPOINT:-minio:9000}
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
            - MINIO_BUCKET=${MINIO_BUCKET:-coursehunt}
            - MINIO_BASE_URL=${MINIO_BASE_URL:-http://localhost:9000/coursehunt}
            - MINIO_SECURE=${MINIO_SECURE:-false}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
            - JWKS_URL=${DOCKER_JWKS_URL:-${JWKS_URL:-http://host.docker.internal:3000/api/auth/jwks}}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.backend.rule=PathPrefix(`/api/v1`)"
            - "traefik.http.routers.backend.entrypoints=web"
            - "traefik.http.services.backend.loadbalancer.server.port=${PORT:-8080}"
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-8080}/api/v1/health || exit 1" ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 15s

networks:
    coursehunt-network:
        driver: bridge

volumes:
    pgdata:
    redisdata:
    miniodata:
