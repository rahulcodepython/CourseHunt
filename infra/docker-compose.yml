name: coursehunt

services:
    traefik:
        image: traefik:latest
        command:
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
            - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
            - "--entrypoints.websecure.address=:443"
            - "--certificatesresolvers.le.acme.httpchallenge=true"
            - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
            - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
            - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
            - "--ping=true"
        ports:
            - "80:80"
            - "443:443"
        environment:
            - DOCKER_API_VERSION=1.41
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt
        networks:
            - coursehunt-network
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "traefik", "healthcheck", "--ping" ]
            interval: 10s
            timeout: 5s
            retries: 3

    web:
        build:
            context: ../apps/web
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        container_name: coursehunt-web
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-coursehunt}?sslmode=disable}
        depends_on:
            postgres:
                condition: service_healthy
            backend:
                condition: service_started
        networks:
            - coursehunt-network
        labels:
            - "traefik.enable=true"
            # No explicit "entrypoints" label: Traefik then attaches this
            # router to every defined entrypoint. In prod that's web(:80,
            # which the static config below redirects to websecure) and
            # websecure(:443, TLS-terminated via tls.certresolver); in local
            # dev (docker-compose.override.yml) the redirect and ACME flags
            # are absent, so :80 just serves plain HTTP as before.
            - "traefik.http.routers.web.rule=Host(`${DOMAIN}`) && PathPrefix(`/`)"
            - "traefik.http.routers.web.tls.certresolver=le"
            - "traefik.http.services.web.loadbalancer.server.port=${PORT:-8080}"
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-8080}/ || exit 1" ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 15s

    postgres:
        build:
            context: ./postgres
        container_name: ${POSTGRES_CONTAINER_NAME:-coursehunt-postgres}
        env_file:
            - ../.env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-coursehunt}
        # pg_cron only activates via shared_preload_libraries, set at server
        # start — see apps/migrator/migrations/000054_ops_retention_cron.up.sql.
        command: [ "postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=${POSTGRES_DB:-coursehunt}" ]
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coursehunt}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: ${REDIS_IMAGE:-redis:7-alpine}
        container_name: ${REDIS_CONTAINER_NAME:-coursehunt-redis}
        env_file:
            - ../.env
        command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
        restart: unless-stopped
        volumes:
            - redisdata:/data
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s

    minio:
        image: ${MINIO_IMAGE:-minio/minio:latest}
        container_name: ${MINIO_CONTAINER_NAME:-coursehunt-minio}
        env_file:
            - ../.env
        command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
        volumes:
            - miniodata:/data
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.minio.rule=Host(`${DOMAIN}`) && PathPrefix(`/coursehunt`)"
            - "traefik.http.routers.minio.tls.certresolver=le"
            - "traefik.http.services.minio.loadbalancer.server.port=9000"
        networks:
            - coursehunt-network
        restart: unless-stopped
        healthcheck:
            test: [ "CMD-SHELL", "mc ready local || curl -f http://localhost:${MINIO_PORT:-9000}/minio/health/live || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # One-shot: brings the schema to the latest version, then exits. `backend`
    # only starts once this completes successfully — see its depends_on below.
    # Postgres itself has no hook that can run a foreign binary on every
    # startup (docker-entrypoint-initdb.d only fires once, on an empty data
    # volume), so this dedicated service is the correct place for it.
    migrator:
        build:
            context: ..
            dockerfile: ./apps/migrator/Dockerfile
        container_name: ${MIGRATOR_CONTAINER_NAME:-coursehunt-migrator}
        env_file:
            - ../.env
        environment:
            - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-coursehunt}?sslmode=disable}
        command: [ "commit" ]
        restart: "no"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - coursehunt-network

    backend:
        build:
            context: ..
            dockerfile: ./apps/server/Dockerfile
        container_name: ${BACKEND_CONTAINER_NAME:-coursehunt-backend}
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            - PORT=${PORT:-8080}
            - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-coursehunt}?sslmode=disable}
            - REDIS_HOST=${DOCKER_REDIS_HOST:-redis}
            - REDIS_PORT=${REDIS_PORT:-6379}
            - MINIO_ENDPOINT=${DOCKER_MINIO_ENDPOINT:-minio:9000}
            - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
            - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
            - MINIO_BUCKET=${MINIO_BUCKET:-coursehunt}
            - MINIO_BASE_URL=${MINIO_BASE_URL:-http://localhost:9000/coursehunt}
            - MINIO_SECURE=${MINIO_SECURE:-false}
            - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
            # web (the Next.js app, which serves /api/auth/[...all] including
            # JWKS) is itself a container here — there is no host-level dev
            # server on :3000 in this deployment, so JWKS must be fetched from
            # the `web` service over the internal network, not host.docker.internal.
            - JWKS_URL=${DOCKER_JWKS_URL:-${JWKS_URL:-http://web:${PORT:-8080}/api/auth/jwks}}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            minio:
                condition: service_healthy
            migrator:
                condition: service_completed_successfully
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/v1`)"
            - "traefik.http.routers.backend.tls.certresolver=le"
            - "traefik.http.services.backend.loadbalancer.server.port=${PORT:-8080}"
        networks:
            - coursehunt-network
        healthcheck:
            test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-8080}/api/v1/health || exit 1" ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 15s

networks:
    coursehunt-network:
        driver: bridge

volumes:
    pgdata:
    redisdata:
    miniodata:
    letsencrypt:
